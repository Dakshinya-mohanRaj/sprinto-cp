<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sprinto - Print Upload Counts</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      margin: 0;
      padding: 16px;
    }
    .header {
      text-align: center;
      padding: 16px 0;
      background: linear-gradient(135deg, #E9E6FB, #DCD7F7);
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .header img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 8px;
    }
    .header h1 {
      margin: 0;
      color: #7C6FDB;
      font-size: 24px;
      letter-spacing: 1px;
    }
    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .search-bar input {
      flex: 1;
      padding: 12px;
      border: 1px solid #D6D2F7;
      border-radius: 10px;
      font-size: 14px;
      color: #5A4FB0;
      background: #fff;
      outline: none;
    }
    .search-bar input::placeholder {
      color: #A8A1E0;
    }
    .search-bar button {
      padding: 12px 16px;
      background: #7C6FDB;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      font-size: 14px;
    }
    th, td {
      border: 1px solid #DCD7F5;
      padding: 18px 10px;
      text-align: center;
    }
    th {
      background: #D6D2F7;
      color: #5A4FB0;
      font-size: 13px;
    }
    th:first-child {
      background: #C4BEF2;
    }
    td:first-child {
      background: #F1EFFB;
      font-weight: bold;
      text-align: left;
      font-size: 12px;
      width: 34%;
      color: #5A4FB0;
    }
    td .count {
      display: block;
      font-size: 26px;
      font-weight: 400;
      color: #7C6FDB;
      margin: 4px 0;
    }
    .row-label {
      font-size: 11px;
      line-height: 1.3;
    }
    .summary {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    .summary .box {
      flex: 1;
      background: #fff;
      border: 1px solid #DCD7F5;
      border-radius: 12px;
      text-align: center;
      padding: 18px 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .summary .box .label {
      font-size: 12px;
      color: #5A4FB0;
      font-weight: bold;
    }
    .summary .box .value {
      font-size: 26px;
      font-weight: 400;
      color: #7C6FDB;
      margin-top: 6px;
    }
    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin-top: 16px;
    }
    .nav button {
      background: #D6D2F7;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 14px;
      color: #5A4FB0;
      cursor: pointer;
      line-height: 1;
    }
    .nav button:disabled {
      opacity: 0.3;
      cursor: default;
    }
    .nav .day-label {
      color: #5A4FB0;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="logo.png" alt="Sprinto" />
    <h1>SPRINTO</h1>
  </div>

  <div class="search-bar">
    <input id="search-input" type="text" placeholder="Search by day or date (e.g. Day 2 or 08/08/2026)" />
    <button onclick="searchDay()">Search</button>
  </div>

  <table>
    <thead>
      <tr>
        <th id="today">Day 1 - 07/08/2026</th>
        <th>Morning</th>
        <th>Afternoon</th>
        <th>Evening</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="row-label">Uploaded Documents</td>
        <td><span class="count" id="upload-morning">0</span></td>
        <td><span class="count" id="upload-afternoon">0</span></td>
        <td><span class="count" id="upload-evening">0</span></td>
      </tr>
      <tr>
        <td class="row-label">Prints Completed</td>
        <td><span class="count" id="print-morning">0</span></td>
        <td><span class="count" id="print-afternoon">0</span></td>
        <td><span class="count" id="print-evening">0</span></td>
      </tr>
      <tr>
        <td class="row-label">Total Sheets Printed</td>
        <td><span class="count" id="sheet-morning">0</span></td>
        <td><span class="count" id="sheet-afternoon">0</span></td>
        <td><span class="count" id="sheet-evening">0</span></td>
      </tr>
    </tbody>
  </table>

  <div class="summary">
    <div class="box">
      <div class="label">Day Sheet Count</div>
      <div class="value" id="day-sheet">0</div>
    </div>
    <div class="box">
      <div class="label">Month Sheet Count (running total)</div>
      <div class="value" id="month-sheet">0</div>
    </div>
  </div>

  <div class="nav">
    <button id="prev" onclick="navDay(-1)" aria-label="Previous day">&#9664;</button>
    <span class="day-label" id="day-label">Day 1</span>
    <button id="next" onclick="navDay(1)" aria-label="Next day">&#9654;</button>
  </div>

  <script>
    // ===== Supabase connection (from .env) =====
    const SUPABASE_URL = "https://fmjfokswraxldbuotgkk.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtamZva3N3cmF4bGRidW90Z2trIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MjE2NjgsImV4cCI6MjEwMDM5NzY2OH0.n0t4bw4IGI-RVNZPg6KQnYTtkar2YV0Jgqn2GzM8ehI";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Project start date - Day 1 is this date
    const START_DATE = "2026-08-07";

    // AUTO DAY SWITCH: next day starts at 4:00 PM
    const DAY_SWITCH_HOUR = 16;

    const SLOT_BY_CODE = { M: "morning", A: "afternoon", E: "evening" };

    // Statuses that count as a completed print (edit as needed)
    const PRINTED_STATUSES = ["PRINTING", "PICKED", "COMPLETED"];

    let records = {};
    let maxDay = 1;
    let viewingAuto = true;

    function formatDateKey(d) {
      const dd = String(d.getDate()).padStart(2, "0");
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      return d.getFullYear() + "-" + mm + "-" + dd;
    }

    function parseDateKey(dateKey) {
      const [y, m, d] = dateKey.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function dateKeyForDay(dayNo) {
      const start = parseDateKey(START_DATE);
      return formatDateKey(new Date(start.getFullYear(), start.getMonth(), start.getDate() + (dayNo - 1)));
    }

    function dayNoForDate(dateStr) {
      const start = parseDateKey(START_DATE);
      const d = parseDateKey(dateStr);
      return Math.floor((d - start) / 86400000) + 1;
    }

    function updateAutoDay() {
      const n = new Date();
      const todayKey = formatDateKey(n);
      const baseDayNo = Math.max(1, dayNoForDate(todayKey));
      const autoNext = n.getHours() >= DAY_SWITCH_HOUR ? 1 : 0;
      const autoDay = baseDayNo + autoNext;
      if (viewingAuto) currentDay = autoDay;
      return autoDay;
    }

    let currentDay = updateAutoDay();

    // Parse order_id "YYMMDD-{M|A|E}-{BLOCK}-{SEQ}" -> { dateKey, slot }
    function parseOrderId(orderId) {
      const m = String(orderId || "").match(/^(\d{2})(\d{2})(\d{2})-([MAE])(?:-(.*))?$/);
      if (!m) return null;
      const year = 2000 + parseInt(m[1], 10);
      const dateKey = year + "-" + m[2] + "-" + m[3];
      return { dateKey: dateKey, slot: SLOT_BY_CODE[m[4]] };
    }

    function slotFromHour(hour) {
      if (hour >= 6 && hour < 12) return "morning";
      if (hour >= 12 && hour < 16) return "afternoon";
      if (hour >= 16 && hour < 22) return "evening";
      return null;
    }

    // Fallback for rows with a missing/invalid order_id: use created_at
    function parseFallback(row) {
      const d = row.created_at ? new Date(row.created_at) : null;
      if (!d || isNaN(d)) return null;
      const dd = String(d.getDate()).padStart(2, "0");
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dateKey = d.getFullYear() + "-" + mm + "-" + dd;
      return { dateKey: dateKey, slot: slotFromHour(d.getHours()) };
    }

    // Sheets for one order = sum of (pages, duplex -> ceil(pages/2)) * copies per file
    function orderSheets(order) {
      let total = 0;
      (order.files || []).forEach((f) => {
        const pages = Number(f.pages) || 0;
        const copies = Number(f.copies) || 1;
        const duplex = !!(f.printSettings && f.printSettings.duplex);
        const sheetsPerCopy = duplex ? Math.ceil(pages / 2) : pages;
        total += sheetsPerCopy * copies;
      });
      return total;
    }

    function emptyCounts() {
      return {
        upload: { morning: 0, afternoon: 0, evening: 0 },
        print: { morning: 0, afternoon: 0, evening: 0 },
        sheet: { morning: 0, afternoon: 0, evening: 0 }
      };
    }

    // Build per-day counts from orders rows
    function buildRecords(rows) {
      const rec = {};
      rows.forEach((r) => {
        const parsed = parseOrderId(r.order_id) || parseFallback(r);
        if (!parsed) return;
        if (!rec[parsed.dateKey]) rec[parsed.dateKey] = emptyCounts();
        const day = rec[parsed.dateKey];
        day.upload[parsed.slot]++;
        if (PRINTED_STATUSES.includes(r.status)) {
          day.print[parsed.slot]++;
          day.sheet[parsed.slot] += orderSheets(r);
        }
      });
      return rec;
    }

    async function fetchOrders() {
      const { data, error } = await supabase
        .from("orders")
        .select("order_id,status,files,created_at");

      if (error) {
        console.error("Supabase error:", error);
        return;
      }

      if (!data || data.length === 0) {
        records = {};
      } else {
        records = buildRecords(data);
      }
      maxDay = Math.max(1, ...Object.keys(records).map(dayNoForDate));
      updateAutoDay();
      if (viewingAuto && currentDay > maxDay) currentDay = maxDay;
      render();
    }

    function render() {
      const dateKey = dateKeyForDay(currentDay);
      const rec = records[dateKey] || emptyCounts();

      for (const type of ["upload", "print", "sheet"]) {
        for (const slot of ["morning", "afternoon", "evening"]) {
          document.getElementById(type + "-" + slot).textContent = rec[type][slot];
        }
      }

      const date = new Date(dateKey + "T00:00:00");
      const dd = String(date.getDate()).padStart(2, "0");
      const mm = String(date.getMonth() + 1).padStart(2, "0");
      document.getElementById("today").textContent = "Day " + currentDay + " - " + dd + "/" + mm + "/" + date.getFullYear();
      document.getElementById("day-label").textContent = "Day " + currentDay;

      const daySheet = rec.sheet.morning + rec.sheet.afternoon + rec.sheet.evening;
      document.getElementById("day-sheet").textContent = daySheet;

      // Month Sheet Count = running total of all sheets from Day 1 to the current day
      let monthSheet = 0;
      for (let d = 1; d <= currentDay; d++) {
        const rd = records[dateKeyForDay(d)];
        if (rd) monthSheet += rd.sheet.morning + rd.sheet.afternoon + rd.sheet.evening;
      }
      document.getElementById("month-sheet").textContent = monthSheet;

      document.getElementById("prev").disabled = currentDay <= 1;
      document.getElementById("next").disabled = currentDay >= maxDay;
    }

    function navDay(dir) {
      viewingAuto = false;
      currentDay += dir;
      render();
    }

    function searchDay() {
      const query = document.getElementById("search-input").value.trim();
      if (!query) return;

      // Match "Day N" or plain number
      let m = query.match(/^day\s*(\d+)$/i);
      let dayNo = m ? parseInt(m[1], 10) : null;

      if (!dayNo && /^\d+$/.test(query)) {
        dayNo = parseInt(query, 10);
      }

      // Match dates: DD/MM/YYYY, DD-MM-YYYY, YYYY-MM-DD
      if (!dayNo) {
        let dm = query.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
        if (dm) {
          const year = dm[3].length === 2 ? "20" + dm[3] : dm[3];
          dayNo = dayNoForDate(year + "-" + String(dm[2]).padStart(2, "0") + "-" + String(dm[1]).padStart(2, "0"));
        } else {
          dm = query.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
          if (dm) {
            dayNo = dayNoForDate(dm[1] + "-" + String(dm[2]).padStart(2, "0") + "-" + String(dm[3]).padStart(2, "0"));
          }
        }
      }

      if (!dayNo || dayNo < 1) {
        alert("Not found. Try like: Day 2, 2, 08/08/2026");
        return;
      }

      currentDay = dayNo;
      viewingAuto = false;
      render();
    }

    document.getElementById("search-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") searchDay();
    });

    // Load once, then refresh every 10 seconds for live counts
    fetchOrders();
    setInterval(fetchOrders, 10000);
  </script>
</body>
</html>
