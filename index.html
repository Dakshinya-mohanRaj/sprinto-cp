<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sprinto - Print Dashboard</title>
  <style>
    :root {
      --primary: #7C6FDB;
      --primary-dark: #7066c1;
      --primary-light: #E9E6FB;
      --primary-faint: #F5F3FD;
      --border: #E4E1F7;
      --text: #3A3760;
      --text-soft: #7671bd;
      --white: #ffffff;
      --danger: #E25C5C;
      --ok: #3FB98A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--primary-faint);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 40px;
    }
    .app { max-width: 480px; margin: 0 auto; }

    .header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 16px;
      padding: 20px 16px 24px;
      text-align: center;
      color: #fff;
      margin-bottom: 14px;
      box-shadow: 0 6px 18px rgba(124, 111, 219, 0.35);
    }
    .header img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
      padding: 3px;
      margin-bottom: 8px;
    }
    .header h1 { font-size: 22px; letter-spacing: 2px; }
    .header .sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }

    .day-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--white);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(60, 40, 120, 0.08);
      margin-bottom: 14px;
    }
    .day-strip button {
      background: var(--primary-light);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 18px;
      color: var(--primary-dark);
      cursor: pointer;
    }
    .day-strip button:disabled { opacity: 0.3; cursor: default; }
    .day-strip .day-info { text-align: center; }
    .day-strip .day-info .day { font-size: 16px; font-weight: 700; }
    .day-strip .day-info .date { font-size: 12px; color: var(--text-soft); margin-top: 2px; }

    .stat-row { display: flex; gap: 10px; margin-bottom: 14px; }
    .stat-card {
      flex: 1;
      background: var(--white);
      border-radius: 14px;
      padding: 14px 8px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(60, 40, 120, 0.08);
    }
    .stat-card .value { font-size: 26px; font-weight: 600; color: var(--primary); }
    .stat-card .label { font-size: 11px; color: var(--text-soft); margin-top: 4px; }

    .card {
      background: var(--white);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(60, 40, 120, 0.08);
      margin-bottom: 14px;
    }
    .card .card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary-dark);
      padding: 2px 4px 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px 6px; text-align: center; }
    th {
      background: var(--primary-light);
      color: var(--primary-dark);
      font-size: 12px;
      border-radius: 8px;
    }
    th:first-child { background: transparent; }
    td {
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text);
      font-weight: 500;
    }
    td:first-child {
      text-align: left;
      font-size: 12px;
      color: var(--text-soft);
      font-weight: 600;
    }
    td .count { font-size: 20px; font-weight: 600; color: var(--text); }
    tr:last-child td { border-bottom: none; }

    .search {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .search input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      color: var(--text);
      background: var(--white);
      outline: none;
    }
    .search input:focus { border-color: var(--primary); }
    .search button {
      padding: 0 18px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: var(--text-soft);
      margin-top: 18px;
    }
    .footer-note .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      margin-right: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <img src="logo.png" alt="Sprinto" />
      <h1>SPRINTO</h1>
      <div class="sub">Print Production Dashboard</div>
    </div>

    <div class="search">
      <input id="date-input" type="date" />
    </div>

    <div class="day-strip">
      <button id="prev" onclick="navDay(-1)" aria-label="Previous day">&#9664;</button>
      <div class="day-info">
        <div class="day" id="day-label">Day 1</div>
        <div class="date" id="date-label">07/08/2026</div>
      </div>
      <button id="next" onclick="navDay(1)" aria-label="Next day">&#9654;</button>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="value" id="stat-uploads">0</div><div class="label">Uploads</div></div>
      <div class="stat-card"><div class="value" id="stat-printed">0</div><div class="label">Printed</div></div>
      <div class="stat-card"><div class="value" id="stat-sheets">0</div><div class="label">Sheets</div></div>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="value" id="month-sheets">0</div><div class="label" id="month-label">Month Sheets</div></div>
    </div>

    <div class="card">
      <div class="card-title">Daily Breakdown</div>
      <table>
        <thead>
          <tr>
            <th></th>
            <th>Morning</th>
            <th>Afternoon</th>
            <th>Evening</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Uploaded</td>
            <td><span class="count" id="upload-morning">0</span></td>
            <td><span class="count" id="upload-afternoon">0</span></td>
            <td><span class="count" id="upload-evening">0</span></td>
          </tr>
          <tr>
            <td>Printed</td>
            <td><span class="count" id="print-morning">0</span></td>
            <td><span class="count" id="print-afternoon">0</span></td>
            <td><span class="count" id="print-evening">0</span></td>
          </tr>
          <tr>
            <td>Sheets</td>
            <td><span class="count" id="sheet-morning">0</span></td>
            <td><span class="count" id="sheet-afternoon">0</span></td>
            <td><span class="count" id="sheet-evening">0</span></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="footer-note">
      <span class="dot"></span>Live &middot; updated <span id="updated-time">--:--:--</span>
    </div>
  </div>

  <script>
    // ================= CONFIG =================
    const SUPABASE_URL = "https://fmjfokswraxldbuotgkk.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtamZva3N3cmF4bGRidW90Z2trIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MjE2NjgsImV4cCI6MjEwMDM5NzY2OH0.n0t4bw4IGI-RVNZPg6KQnYTtkar2YV0Jgqn2GzM8ehI";
    const START_DATE = "2026-08-10"; // Day 1 - official counting starts here (10/08/2026)
    const DAY_SWITCH_HOUR = 16;      // Orders placed at/after 4:00 PM belong to the NEXT day's table
    const PRINTED_STATUSES = ["PRINTING", "PICKED", "COMPLETED"]; // counts toward Printed & Sheets
    const PAID_STATUSES = ["PAID", "PRINTING", "PICKED", "COMPLETED"]; // payment done -> counts as uploaded
    const SLOT_BY_CODE = { M: "morning", A: "afternoon", E: "evening" };
    const POLL_MS = 10000;

    // ================= STATE =================
    let records = {};   // dateKey -> counts
    let currentDay = 1;
    let viewingAuto = true;

    // ================= DATE HELPERS =================
    function pad(n) { return String(n).padStart(2, "0"); }
    function formatDateKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
    function parseDateKey(key) { const [y, m, d] = key.split("-").map(Number); return new Date(y, m - 1, d); }
    function dateKeyForDay(dayNo) {
      const s = parseDateKey(START_DATE);
      return formatDateKey(new Date(s.getFullYear(), s.getMonth(), s.getDate() + (dayNo - 1)));
    }
    function dayNoForDate(key) {
      const s = parseDateKey(START_DATE);
      const d = parseDateKey(key);
      return Math.floor((d - s) / 86400000) + 1;
    }
    function nextDateKey(key) {
      const d = parseDateKey(key);
      return formatDateKey(new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1));
    }

    function updateAutoDay() {
      if (!viewingAuto) return;
      const n = new Date();
      let day = dayNoForDate(formatDateKey(n));
      if (n.getHours() >= DAY_SWITCH_HOUR) day += 1; // after 4 PM, open the next day's table
      currentDay = Math.max(1, day);
    }

    // ================= ORDER PARSING =================
    // order_id "YYMMDD-{M|A|E}-{BLOCK}-{SEQ}" -> { dateKey, slot }
    function parseOrderId(orderId) {
      const m = String(orderId || "").match(/^(\d{2})(\d{2})(\d{2})-([MAE])(?:-(.*))?$/);
      if (!m) return null;
      return {
        dateKey: (2000 + parseInt(m[1], 10)) + "-" + m[2] + "-" + m[3],
        slot: SLOT_BY_CODE[m[4]]
      };
    }
    function slotFromCode(code) {
      return SLOT_BY_CODE[code] || null;
    }
    function deliveryToSlot(name) {
      const m = { morning: "morning", afternoon: "afternoon", evening: "evening" };
      return m[name] || null;
    }

    // Sheets per order = sum of (pages, duplex => ceil(pages/2)) * copies
    function orderSheets(order) {
      let total = 0;
      (order.files || []).forEach((f) => {
        const pages = Number(f.pages) || 0;
        const copies = Number(f.copies) || 1;
        const duplex = !!(f.printSettings && f.printSettings.duplex);
        total += (duplex ? Math.ceil(pages / 2) : pages) * copies;
      });
      return total;
    }

    function emptyCounts() {
      return {
        upload: { morning: 0, afternoon: 0, evening: 0 },
        print: { morning: 0, afternoon: 0, evening: 0 },
        sheet: { morning: 0, afternoon: 0, evening: 0 }
      };
    }

    function buildRecords(rows) {
      const rec = {};
      rows.forEach((r) => {
        // Only count orders whose payment is done (PAYMENT_PENDING / FAILED are skipped)
        if (!PAID_STATUSES.includes(r.status)) return;

        const parsed = parseOrderId(r.order_id);
        const placed = r.created_at ? new Date(r.created_at) : null;

        // DAY SWITCH RULE: the production day is the placement date, but an
        // order placed at/after 4:00 PM (DAY_SWITCH_HOUR) is booked for the
        // NEXT day's production and is counted in that day's table instead.
        let dateKey;
        if (placed && !isNaN(placed)) {
          dateKey = formatDateKey(placed);
          if (placed.getHours() >= DAY_SWITCH_HOUR) dateKey = nextDateKey(dateKey);
        } else if (parsed) {
          dateKey = parsed.dateKey;
        } else {
          return; // cannot place this row
        }

        // Slot column = the slot the student actually selected, never guessed from the time:
        //   1) metadata.timingCode (M/A/E)   2) the M/A/E inside order_id   3) metadata.deliveryTime
        const slot =
          slotFromCode(r.metadata && r.metadata.timingCode) ||
          (parsed && parsed.slot) ||
          deliveryToSlot(r.metadata && r.metadata.deliveryTime);
        if (!slot) return;

        if (!rec[dateKey]) rec[dateKey] = emptyCounts();
        const day = rec[dateKey];
        day.upload[slot]++;
        if (PRINTED_STATUSES.includes(r.status)) {
          day.print[slot]++;
          day.sheet[slot] += orderSheets(r);
        }
      });
      return rec;
    }

    // ================= DATA FETCH =================
    async function fetchOrders() {
      try {
        const res = await fetch(
          SUPABASE_URL + "/rest/v1/orders?select=order_id,status,files,created_at,metadata&order=created_at",
          {
            headers: {
              "apikey": SUPABASE_ANON_KEY,
              "Authorization": "Bearer " + SUPABASE_ANON_KEY,
              "Accept": "application/json"
            }
          }
        );
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        records = buildRecords(data || []);
        const t = new Date();
        document.getElementById("updated-time").textContent =
          pad(t.getHours()) + ":" + pad(t.getMinutes()) + ":" + pad(t.getSeconds());
      } catch (err) {
        console.error("Supabase error:", err);
        document.getElementById("updated-time").textContent = "error";
      }
      render();
    }

    // ================= RENDER =================
    function render() {
      const dateKey = dateKeyForDay(currentDay);
      const rec = records[dateKey] || emptyCounts();

      for (const type of ["upload", "print", "sheet"]) {
        for (const slot of ["morning", "afternoon", "evening"]) {
          document.getElementById(type + "-" + slot).textContent = rec[type][slot];
        }
      }

      const dayUploads = rec.upload.morning + rec.upload.afternoon + rec.upload.evening;
      const dayPrinted = rec.print.morning + rec.print.afternoon + rec.print.evening;
      const daySheets = rec.sheet.morning + rec.sheet.afternoon + rec.sheet.evening;

      document.getElementById("stat-uploads").textContent = dayUploads;
      document.getElementById("stat-printed").textContent = dayPrinted;
      document.getElementById("stat-sheets").textContent = daySheets;

      const d = parseDateKey(dateKey);
      document.getElementById("day-label").textContent = "Day " + currentDay;
      document.getElementById("date-label").textContent =
        pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear();
      document.getElementById("date-input").value = dateKey;

      // Month Sheets = total of ALL days in the viewed calendar month.
      // The total is always based on the month length: 30-day month -> 30 day total, 31-day month -> 31 day total.
      const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      const y = d.getFullYear(), m = d.getMonth();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      let monthSheets = 0;
      for (let day = 1; day <= daysInMonth; day++) {
        const key = y + "-" + pad(m + 1) + "-" + pad(day);
        if (key < START_DATE) continue; // only officially counted days (Day 1 = START_DATE)
        const rd = records[key];
        if (rd) monthSheets += rd.sheet.morning + rd.sheet.afternoon + rd.sheet.evening;
      }
      document.getElementById("month-sheets").textContent = monthSheets;
      document.getElementById("month-label").textContent =
        monthNames[m] + " " + y + " total (" + daysInMonth + " days)";

      document.getElementById("prev").disabled = currentDay <= 1;
      document.getElementById("next").disabled = false;
    }

    // ================= ACTIONS =================
    function navDay(dir) {
      viewingAuto = false;
      currentDay = Math.max(1, currentDay + dir);
      render();
    }

    function pickDate(value) {
      if (!value) return;
      const dayNo = Math.max(1, dayNoForDate(value));
      viewingAuto = false;
      currentDay = dayNo;
      render();
    }

    document.getElementById("date-input").addEventListener("change", (e) => {
      pickDate(e.target.value);
    });

    // ================= INIT =================
    updateAutoDay();
    render();
    fetchOrders();
    setInterval(fetchOrders, POLL_MS);
  </script>
</body>
</html>
